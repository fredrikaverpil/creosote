version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: cron
      cronjob: "0 6 1 * *"
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
    labels: [dependencies]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: cron
      cronjob: "0 6 1 * *"
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    groups:
      uv:
        patterns: ["*"]
        update-types: [minor, patch]
    labels: [dependencies]
