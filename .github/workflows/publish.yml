name: publish

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5.2.10
        with:
          version: 2026.11.10
          cache: false

      - name: build package
        run: mise run py:build

      - name: save artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: wheel
          path: dist

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/creosote
    permissions:
      id-token: write
    steps:
      - name: retrieve artifact
        uses: actions/download-artifact@v8.0.2
        with:
          name: wheel
          path: dist

      - name: publish wheel
        if: github.event_name == 'release' && startsWith(github.ref, 'refs/tags')
        uses: pypa/gh-action-pypi-publish@v1.14.3
