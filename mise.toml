[settings]
lockfile = true
minimum_release_age = "3d"

[tools]
rumdl = "0.2.52"
uv = "0.13.1"

[hooks]
enter = { task = "py:sync" }

# Python

[tasks."py:sync"]
description = "Sync Python dependencies"
run = "uv sync --all-groups --frozen"

[tasks."py:format"]
description = "Format Python files"
run = "uv run --frozen --group lint ruff format ."

[tasks."py:lint"]
description = "Lint Python files, with fixes"
run = "uv run --frozen --group lint ruff check --fix ."

[tasks."py:typecheck"]
description = "Type-check Python files"
run = "uv run --frozen --group types --group test mypy ."

[tasks."py:test"]
description = "Run tests with coverage"
run = [
  "uv run --frozen --group test coverage run -m pytest",
  "uv run --frozen --group test coverage report",
]

[tasks."py:build"]
description = "Build the wheel"
run = "uv build --wheel"

[tasks."py:deps"]
description = "Run creosote on itself"
run = "uv run --frozen creosote --venv .venv --include-deferred"

[tasks."pre-commit:lint"]
description = "Check that .pre-commit-config.yaml revs have a v prefix"
run = """
if grep -n 'rev:' .pre-commit-config.yaml | grep -v 'rev: v'; then
  echo "found rev: entries without 'v' prefix" >&2
  exit 1
fi
"""

# Markdown

[tasks."md:lint"]
description = "Lint Markdown files, with fixes"
run = "rumdl check --fix ."

# Renovate

# validate: check renovate.json. dry-run: list the updates Renovate would
# propose (local only, needs `gh auth`).
[tasks.renovate]
description = "Validate renovate.json, or dry-run Renovate's lookups"
usage = 'arg "<mode>" help="validate or dry-run" { choices "validate" "dry-run" }'
tools = { node = "26.13.1", "npm:renovate" = { version = "44.255.2", trust_policy_excludes = ["@yarnpkg/libzip@3.2.2"] }, jq = "1.8.2" }
run = '''
set -eu
case "$usage_mode" in
validate)
  renovate-config-validator --strict --no-global renovate.json
  ;;
dry-run)
  report=$(mktemp)
  token=$(gh auth token)
  RENOVATE_TOKEN=$token GITHUB_COM_TOKEN=$token LOG_LEVEL=error \
    renovate --platform=local --dry-run=lookup \
    --report-type=file --report-path="$report"
  jq -r '
    .repositories[].packageFiles[][] | .packageFile as $file | .deps[]
    | . as $dep | .updates[]?
    | "\($file): \($dep.depName) \($dep.currentValue) -> \(.newValue // .newVersion)"
      + (if .pendingChecks then " (pending)" else "" end)
  ' "$report"
  rm -f "$report"
  ;;
esac
'''

# Tasks that write files run one at a time; read-only checks in parallel.
[tasks.default]
description = "Run all checks"
run = [
  { task = "py:format" },
  { task = "md:lint" },
  { task = "py:lint" },
  { tasks = ["py:typecheck", "py:test", "py:deps", "pre-commit:lint"] },
]
